services:
  staynest.api:
    image: ${DOCKER_REGISTRY-}staynestapi
    container_name: StayNest.Api
    build:
      context: .
      dockerfile: src/StayNest.Api/Dockerfile
    depends_on:
      - staynest-db

  staynest-db:
    image: postgres:latest
    container_name: StayNest.DB
    environment:
      POSTGRES_DB: staynest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./.containers/database:/var/lib/postgresql
    ports:
      - "5432:5432"

  staynest-idp:
    image: quay.io/keycloak/keycloak:latest
    container_name: StayNest.Identity
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./.containers/identity:/opt/keycloak/data
    ports:
      - 18080:8080

  staynest-seq:
    image: datalust/seq:latest
    container_name: StayNest.SEQ
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:5341"
      - "8086:80"
    volumes:
      - seq-data:/data


volumes:
  seq-data: